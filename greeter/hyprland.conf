# greeter's Hyprland, run by greetd (classic; hyprland.lua for Lua configs)

monitor = , preferred, auto, auto

# greeter state (last session); install.sh creates it
env = XDG_STATE_HOME, /var/lib/aero-greeter
env = XCURSOR_SIZE, 24

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

animations {
    enabled = false
}

exec-once = qs -p /usr/local/share/aero-bar/greeter.qml; hyprctl dispatch exit
